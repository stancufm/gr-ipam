name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m py_compile bin/gr libexec/validate-ssh libexec/collect-version
      - name: Validate installer syntax
        run: sh -n install.sh && sh -n libexec/gr-update
      - name: Test SSH audit format
        run: python3 tests/test_audit.py
      - name: Test configuration inventory
        run: python3 tests/test_config.py
      - name: Test detailed find output
        run: python3 tests/test_find.py
      - name: Test self-update CLI
        run: python3 tests/test_self_update.py
      - name: Test isolated installation
        run: |
          sh install.sh --destdir "$RUNNER_TEMP/gr-root" \
            --base-url https://ipam.example.net --username api-test
          "$RUNNER_TEMP/gr-root/usr/local/bin/gr" --help >/dev/null
          "$RUNNER_TEMP/gr-root/usr/local/bin/gr" --version
          test -x "$RUNNER_TEMP/gr-root/usr/local/libexec/gr/gr-update"
          test -f "$RUNNER_TEMP/gr-root/etc/gr/update.json"
          test -f "$RUNNER_TEMP/gr-root/etc/gr/release-key.asc"
          gpg --batch --show-keys "$RUNNER_TEMP/gr-root/etc/gr/release-key.asc"
